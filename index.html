<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Creator Clash - Leaderboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0b0f19;
            color: #ffffff;
        }
        .gradient-text {
            background: linear-gradient(135deg, #a855f7, #ec4899);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .card-gradient {
            background: linear-gradient(180deg, rgba(30, 27, 75, 0.7) 0%, rgba(15, 23, 42, 0.8) 100%);
            border: 1px solid rgba(168, 85, 247, 0.3);
        }
    </style>
</head>
<body class="min-h-screen pb-12 flex flex-col items-center px-4">

    <!-- Header / Navbar -->
    <header class="w-full max-w-xl py-6 flex justify-between items-center">
        <h1 class="text-2xl font-black tracking-wider gradient-text uppercase">CreatorClash</h1>
        <button class="bg-gradient-to-r from-purple-600 to-pink-600 text-white font-bold text-xs px-4 py-2 rounded-full uppercase tracking-wider hover:opacity-90 transition">
            Join Season 0
        </button>
    </header>

    <!-- Main Container -->
    <main class="w-full max-w-xl flex flex-col gap-6">

        <!-- Title & Region Selector -->
        <div class="flex justify-between items-center">
            <div>
                <h2 class="text-xl font-extrabold text-white">Global Warzone</h2>
                <p class="text-lg font-bold text-slate-300">Creators</p>
            </div>
            <div class="flex gap-1 bg-slate-900/80 p-1 rounded-lg border border-slate-800">
                <button class="px-3 py-1 text-xs font-bold bg-purple-600 text-white rounded-md">Global</button>
                <button class="px-3 py-1 text-xs font-bold text-slate-400 hover:text-white transition">NA</button>
                <button class="px-3 py-1 text-xs font-bold text-slate-400 hover:text-white transition">EU</button>
            </div>
        </div>

        <!-- Leaderboard Table Card -->
        <div class="card-gradient rounded-2xl overflow-hidden shadow-2xl">
            <div id="leaderboardContainer" class="divide-y divide-slate-800/60">
                <div class="p-8 text-center text-slate-400 text-sm animate-pulse">
                    Caricamento classifica...
                </div>
            </div>
        </div>

        <!-- Status Card -->
        <div class="card-gradient rounded-3xl p-6 relative overflow-hidden text-center flex flex-col items-center gap-4">
            <div class="absolute top-0 right-0 bg-pink-600 text-white text-[10px] font-black px-4 py-1 rounded-bl-xl uppercase tracking-widest">
                Verified Beta Spot
            </div>

            <div class="text-4xl mt-2">🔥</div>

            <div>
                <h3 class="text-2xl font-black text-white tracking-wide">YOU'RE IN THE BETA!</h3>
                <p class="text-sm text-slate-300 mt-1">Welcome to Season 0</p>
            </div>

            <!-- Status Box -->
            <div class="w-full bg-slate-950/60 border border-slate-800 rounded-xl p-4 flex flex-col items-center">
                <span class="text-[11px] font-bold text-slate-400 uppercase tracking-widest mb-1">Status Awarded</span>
                <span class="text-lg font-black text-white tracking-wide">FOUNDING CREATOR BADGE</span>
            </div>

            <!-- Call To Action -->
            <div class="mt-2 text-xs font-bold text-slate-300 tracking-wider">
                📸 SCREENSHOT THIS SCREEN!
            </div>
            <p class="text-[11px] text-slate-400 max-w-xs -mt-2">
                Post it on your <span class="text-slate-200 font-semibold">Instagram Stories</span> & tag 
                <span class="text-purple-400 font-semibold">@CreatorClash</span> to lock your spot and get featured!
            </p>

            <button class="w-full py-3 bg-black hover:bg-slate-900 border border-slate-700 text-white font-bold text-xs rounded-xl transition flex items-center justify-center gap-2 mt-1">
                Share on X / Twitter
            </button>
        </div>

    </main>

    <!-- JavaScript logic -->
    <script>
        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx_xe2kK27aHL9tW0Bq4Beb607eqhGEZ68aM0Fgq9w0Fe-c0q3aWNixO3z1okiGjvA/exec";

        function handleLeaderboardData(data) {
            const container = document.getElementById('leaderboardContainer');
            
            if (!data || data.length === 0) {
                container.innerHTML = `<div class="p-6 text-center text-slate-400 text-sm">Nessun creator in classifica.</div>`;
                return;
            }

            let html = '';
            data.forEach((item, index) => {
                const rank = index + 1;
                let rankBadge = `<span class="text-slate-400 font-bold w-6 text-center">${rank}</span>`;
                
                if (rank === 1) rankBadge = `<span class="text-amber-400 font-extrabold w-6 text-center">🥇</span>`;
                if (rank === 2) rankBadge = `<span class="text-slate-300 font-extrabold w-6 text-center">🥈</span>`;
                if (rank === 3) rankBadge = `<span class="text-amber-600 font-extrabold w-6 text-center">🥉</span>`;

                html += `
                    <div class="p-4 flex items-center justify-between hover:bg-slate-800/30 transition">
                        <div class="flex items-center gap-3">
                            ${rankBadge}
                            <div>
                                <div class="font-bold text-white text-sm">${item.handle || 'Anonimo'}</div>
                                <div class="text-[10px] text-purple-400 uppercase font-semibold tracking-wider">Founding Creator</div>
                            </div>
                        </div>
                        <div class="bg-purple-950/50 border border-purple-500/30 px-3 py-1 rounded-full text-xs font-black text-purple-300">
                            #${item.badge || 'N/A'}
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html;
        }

        function loadLeaderboard() {
            const container = document.getElementById('leaderboardContainer');
            const oldScript = document.getElementById('jsonp-script');
            if (oldScript) oldScript.remove();

            const script = document.createElement('script');
            script.id = 'jsonp-script';
            
            // Forzo l'aggiornamento evitando la cache del browser
            script.src = GOOGLE_SCRIPT_URL + '?callback=handleLeaderboardData&_t=' + Date.now();
            
            script.onerror = function() {
                container.innerHTML = `<div class="p-6 text-center text-slate-400 text-sm">Impossibile caricare la classifica al momento.</div>`;
            };
            document.body.appendChild(script);
        }

        // Caricamento all'avvio
        loadLeaderboard();
    </script>
</body>
</html>
