<script>
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx_xe2kK27aHL9tWObq4Beb607eqhGEZ68aM0Fgq9w0Fe-c0q3aWNixO3z1okiGjvA/exec";

    document.getElementById('signupForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const handle = document.getElementById('creatorHandle').value;
        const randomBadge = Math.floor(Math.random() * 80) + 21;
        
        document.getElementById('displayHandle').innerText = handle;
        document.getElementById('badgeNum').innerText = randomBadge;
        
        // Invia i dati al Google Sheet in background
        fetch(GOOGLE_SCRIPT_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify({
                handle: handle,
                badge: randomBadge
            })
        });

        // Mostra subito la card di conferma per lo screenshot
        document.getElementById('formContainer').classList.add('hidden');
        document.getElementById('successCard').classList.remove('hidden');
    });

    function shareOnX() {
        const handle = document.getElementById('displayHandle').innerText;
        const text = encodeURIComponent(`Just locked in my Founding Creator spot for @CreatorClash Season 0 Beta! 🎯\n\nClaim yours before spots run out:`);
        const url = encodeURIComponent(window.location.href);
        window.open(`https://twitter.com/intent/tweet?text=${text}&url=${url}`, '_blank');
    }
</script>
